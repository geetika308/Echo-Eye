<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Echo-Eye - Voice Object Detection</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Camera + drawing layer */
    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }
    #video, #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Start screen text */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0a0a0a;
      pointer-events: none;
    }
    #start-overlay h1 {
      font-size: clamp(2.2rem, 9vw, 4rem);
      color: #00ff9d;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    #start-overlay p {
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      line-height: 1.6;
      margin: 4px 0;
    }

    /* Status line */
    #status-text {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      z-index: 3;
      text-align: center;
      font-size: 1.1rem;
      color: #00ff9d;
      padding: 0 16px;
      pointer-events: none;
    }

    /* Last spoken text */
    #last-detection {
      position: fixed;
      left: 16px;
      right: 16px;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      z-index: 3;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00ff9d;
      border-radius: 14px;
      padding: 12px 16px;
      text-align: center;
      font-size: 1.4rem;
      pointer-events: none;
    }

    /* Full-screen invisible tap button (always on top) */
    #app-button {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #app-button:focus-visible {
      outline: 4px solid #00ff9d;
      outline-offset: -8px;
    }

    /* Screen-reader only live region */
    #live-announcer {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Camera and detection boxes -->
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <!-- Start screen -->
  <div id="start-overlay">
    <h1>Echo-Eye</h1>
    <p>Tap anywhere.</p>
    <p>Say "English" for English.</p>
    <p>हिंदी के लिए "हिंदी" कहें।</p>
  </div>

  <div id="status-text">Tap anywhere to start</div>

  <div id="last-detection" class="hidden">
    <span id="detection-text"></span>
  </div>

  <div id="live-announcer" aria-live="polite" role="status"></div>

  <!-- Tap anywhere -->
  <button id="app-button" type="button" aria-label="Tap anywhere to start or stop. Say English or Hindi to choose language."></button>

  <!-- AI libraries (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

  <!-- Your files (translations must load before app) -->
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
